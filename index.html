<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>infuse</title>
    <link rel="icon" type="image/png" href="/images/icons/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent-rgb: 180, 30, 30;
            --accent: #b41e1e;
            --accent-soft: rgba(180, 30, 30, 0.12);
            --accent-glow: rgba(180, 30, 30, 0.35);
            --accent-border: rgba(140, 20, 20, 0.55);
            --accent-muted: #7a1a1a;
            --accent-light: #e05555;
            --text-dim: #8a5a5a;
            --text-mid: #c08080;
            --text-bright: #f5e0e0;
            --bg: #0b0808;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: "Outfit", "Segoe UI", Arial, sans-serif;
            font-weight: 600;
            user-select: none;
        }

        iframe {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 0;
        }

        .taskbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            background: rgba(20, 8, 8, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--accent-border);
            border-radius: 18px;
            z-index: 100;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(180, 30, 30, 0.08),
                inset 0 1px 0 rgba(255, 80, 80, 0.06);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .taskbar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.18s ease;
            position: relative;
            font-family: "Outfit", sans-serif;
            font-weight: 700;
        }

        .taskbar-btn:focus,
        .taskbar-btn:focus-visible {
            outline: none;
        }

        .taskbar-btn:hover {
            background: rgba(180, 30, 30, 0.13);
            color: var(--text-mid);
        }

        .taskbar-btn.active {
            background: rgba(180, 30, 30, 0.2);
            color: var(--accent-light);
            box-shadow: 0 0 18px rgba(180, 30, 30, 0.3);
        }

        .taskbar-divider {
            width: 1px;
            height: 24px;
            background: rgba(140, 20, 20, 0.7);
            margin: 0 4px;
        }

        .taskbar-btn::after {
            content: attr(data-tip);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            padding: 6px 12px;
            background: rgba(14, 6, 6, 0.97);
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            color: var(--text-bright);
            font-size: 11px;
            font-family: "Outfit", Arial, sans-serif;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: lowercase;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.15s ease;
        }

        .taskbar-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .taskbar.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
        }

        .toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            color: #fff;
            padding: .6rem 1rem;
            border-radius: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .18s ease, transform .18s ease;
            z-index: 9999;
            pointer-events: none;
            background: var(--accent-muted);
            font-family: "Outfit", sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 24px rgba(180, 30, 30, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: none;
        }
    </style>
</head>
<body>
    <iframe id="frame" src="home.html"></iframe>
    <script src="/storage/js/c.js"></script>
    <div class="taskbar" id="taskbar">
        <button class="taskbar-btn" data-tip="home" data-src="/home.html">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="taskbar-btn" data-tip="study" data-src="/study.html">
            <i class="fa-solid fa-gamepad"></i>
        </button>
        <button class="taskbar-btn" data-tip="apps" data-src="/apps.html">
            <i class="fa-solid fa-th-large"></i>
        </button>
        <button class="taskbar-btn" data-tip="browse" data-src="/browse.html">
            <i class="fa-solid fa-globe"></i>
        </button>
        <div class="taskbar-divider"></div>
        <button class="taskbar-btn" data-tip="settings" data-src="/settings.html">
            <i class="fa-solid fa-gear"></i>
        </button>
        <button class="taskbar-btn" id="cloakBtn" data-tip="cloak">
            <i class="fa-solid fa-shield-halved"></i>
        </button>
        <button class="taskbar-btn" id="closeTaskbar" data-tip="close">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    <div id="toast" class="toast"></div>
<script>
const iframe = document.getElementById("frame");
const buttons = document.querySelectorAll(".taskbar-btn[data-src]");

function setActiveBySrc(src) {
    buttons.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.src === src);
    });
}

function navigate(btn) {
    const src = btn.dataset.src;
    iframe.src = src;
    setActiveBySrc(src);
}

buttons.forEach(btn => {
    btn.addEventListener("click", () => navigate(btn));
});

setActiveBySrc("/home.html");

function syncActive() {
    try {
        const path = iframe.contentWindow.location.pathname;
        if (path) setActiveBySrc(path);
    } catch (e) {
        setActiveBySrc(iframe.src);
    }
}

iframe.addEventListener("load", syncActive);

setInterval(syncActive, 500);

const taskbar = document.getElementById("taskbar");
const closeBtn = document.getElementById("closeTaskbar");

let taskbarVisible = true;
let taskbarState = "open";

function showTaskbar() {
    taskbarVisible = true;
    taskbarState = "open";
    taskbar.classList.remove("hidden");
    taskbar.style.pointerEvents = "auto";
}

function hideTaskbar() {
    taskbarVisible = false;
    taskbarState = "hidden";
    taskbar.classList.add("hidden");
    taskbar.style.pointerEvents = "none";
}

closeBtn.addEventListener("click", () => {
    if (taskbarState !== "open") return;
    taskbarState = "closing";
    hideTaskbar();
    showToast("press \\ to reopen taskbar (above enter key)");
    setTimeout(() => {
        taskbarState = "hidden";
    }, 250);
});

function handleBackslash(e) {
    if (e.code !== "Backslash" || e.repeat) return;
    e.preventDefault();
    if (taskbarVisible) {
        hideTaskbar();
    } else {
        showTaskbar();
    }
}

window.addEventListener("keydown", handleBackslash, true);
iframe.addEventListener("load", () => {
    try {
        iframe.contentWindow.addEventListener("keydown", handleBackslash, true);
    } catch(e) {}
});

const toast = document.getElementById("toast");
let toastTimeout;

function showToast(txt, time = 1500) {
    if (!toast) return;
    toast.textContent = txt;
    toast.classList.add("show");
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
    }, time);
}

document.getElementById("cloakBtn").addEventListener("click", () => {
    localStorage.getItem("blobButton") === "true" ? openBlob() : openAbout();
});
</script>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let deviceId = localStorage.getItem("deviceId");
if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("deviceId", deviceId);
}
socket.emit("register-device", deviceId);
socket.on("online-users", (count) => {
  if (!iframe || !iframe.contentWindow) return;
  iframe.contentWindow.postMessage(
    { type: "online-users", count },
    "*"
  );
});
</script>
</body>
</html>
