<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xylora - apps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #080d0b;
    --panel: #0d1612;
    --panel2: #121f1a;
    --border: #1a2822;
    --border2: #253830;
    --accent: #3f7f63;
    --accent2: #5fae87;
    --text: #e8f2ee;
    --muted: #526a60;
    --muted2: #88a49a;
    --glow: rgba(63, 127, 99, 0.18);
}

html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("/images/themes/forest_v2.png") center/cover no-repeat;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 0;
}

.wrap {
    position: relative;
    z-index: 1;
}

.top {
    text-align: center;
    padding: 52px 20px 24px;
}

.logo {
    font-size: 38px;
    font-weight: 700;
    text-transform: lowercase;
}

.logo em {
    font-style: normal;
    color: var(--accent);
}

.sub {
    margin-top: 7px;
    font-size: 12px;
    color: var(--muted2);
    letter-spacing: 0.1em;
}

.search-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
}

.search-wrap i {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.search-wrap input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border-radius: 12px;
    border: 1px solid var(--border2);
    background: var(--panel);
    color: var(--text);
    outline: none;
}

.search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--glow);
}

.meta {
    max-width: 900px;
    margin: 10px auto 0;
    padding: 0 24px;
    font-size: 11px;
    color: var(--muted);
}

#count {
    color: var(--accent2);
}

.content {
    max-width: 900px;
    margin: auto;
    padding: 18px 24px 60px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.card {
    display: block;
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel2);
    position: relative;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
}

.card-img {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    position: relative;
}

.card-img::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: var(--thumb);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.card-foot {
    padding: 8px 10px 9px;
    background: var(--panel2);
    border-top: 1px solid var(--border);
}

.card-foot span {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    text-transform: lowercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 10px 28px rgba(63, 127, 99, 0.2);
}

.empty {
    display: none;
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    font-size: 13px;
}

@media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 700px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<script src="/storage/js/c.js"></script>
<div class="wrap">
    <div class="top">
        <div class="logo">xy<em>lora</em></div>
        <div class="sub">apps</div>
    </div>
    <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" placeholder="search apps..." autocomplete="off">
    </div>
    <div class="meta"><span id="count"></span></div>
    <div class="content">
        <div class="grid" id="grid">
            <a class="card" href="/apps/htmlcoder.html" data-title="htmlcoder" data-bg="/images/apps/htmlcoder.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>htmlcoder</span></div>
            </a>
            <a class="card" href="/apps/localstorage.html" data-title="localstorage editor" data-bg="/images/apps/htmlcoder.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>localstorage editor</span></div>
            </a>
            <a class="card" href="/apps/soundcloud.html" data-title="soundcloud" data-bg="/images/apps/soundcloud.jpg">
                <div class="card-img"></div>
                <div class="card-foot"><span>soundcloud</span></div>
            </a>
            <a class="card" href="/apps/coolmath.html" data-title="coolmath" data-bg="/images/apps/coolmath.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>coolmath</span></div>
            </a>
            <a class="card" href="/apps/crazy.html" data-title="crazyapps" data-bg="/images/apps/crazyapps.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>crazyapps</span></div>
            </a>
            <a class="card" href="/apps/movies.html" data-title="movies" data-bg="/images/apps/movies.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>movies</span></div>
            </a>
            <a class="card" href="/apps/tiktok.html" data-title="tiktok" data-bg="/images/apps/tiktok.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>tiktok</span></div>
            </a>
            <a class="card" href="/apps/evr.html" data-title="everest ai" data-bg="/images/apps/evr.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>everest ai</span></div>
            </a>
            <a class="card" href="/apps/geforce.html" data-title="geforce now" data-bg="/images/apps/geforce.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>geforce now</span></div>
            </a>
            <a class="card" href="/apps/nowggfun.html" data-title="nowgg.fun" data-bg="/images/apps/nowggfun.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>nowgg.fun (may be broken)</span></div>
            </a>
            <a class="card" href="/apps/music.html" data-title="music" data-bg="/images/apps/vapormusic.png">
                <div class="card-img"></div>
                <div class="card-foot"><span>music</span></div>
            </a>
            <div class="empty"><i class="fa-solid fa-face-sad-tear"></i>no results</div>
        </div>
    </div>
</div>
<script>
const cards = document.querySelectorAll(".card");
const empty = document.querySelector(".empty");
const count = document.getElementById("count");
const search = document.getElementById("search");

cards.forEach(c => {
    const img = c.querySelector(".card-img");
    img.style.setProperty("--thumb", `url("${c.dataset.bg}")`);
});

function update() {
    const q = search.value.toLowerCase().trim();
    let show = 0;

    cards.forEach(c => {
        const ok = !q || c.dataset.title.includes(q);
        c.style.display = ok ? "" : "none";
        if (ok) show++;
    });

    empty.style.display = show ? "none" : "block";
    count.textContent = show + " apps";
}

search.addEventListener("input", update);
update();
</script>
<script src="https://pl29313275.profitablecpmratenetwork.com/d7/26/36/d72636e4a5a9ceffade2057369bbeac6.js"></script>
</body>
</html>
