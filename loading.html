<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>loading...</title>
<link rel="icon" type="image/png" href="images/other/pinkdino.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Outfit", Arial, sans-serif;
    font-weight: 600;
    background: #0b0808;
}

/* ── BACKGROUND ────────────────────────────────────────────
   To change the background image, update the url() below.
   Example: url("/images/themes/your_image.png")
   To remove it, delete the body::before block entirely.
─────────────────────────────────────────────────────────── */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("/images/themes/forest_v2.png") center/cover no-repeat;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 0;
}

.wrap {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
    transform: translateY(-2vh);
}

.logo {
    font-size: 46px;
    font-weight: 800;
    color: #f5e0e0;
    letter-spacing: 2px;
    text-transform: lowercase;
    text-shadow: 0 0 20px rgba(180, 30, 30, 0.3);
}

.logo em {
    font-style: normal;
    color: #e05555;
}

.bar-wrap {
    width: 320px;
    height: 10px;
    background: rgba(180, 30, 30, 0.15);
    border-radius: 999px;
    position: relative;
}

#loading-bar {
    height: 100%;
    width: 0%;
    background: #b41e1e;
    border-radius: 999px;
    transition: width 0.05s linear;
    box-shadow: 0 0 12px rgba(180, 30, 30, 0.55);
}

#loading-dino {
    position: absolute;
    top: -12px;
    width: 28px;
    left: -14px;
    filter: drop-shadow(0 0 6px rgba(180, 30, 30, 0.65));
}

.loading-text {
    font-size: 13px;
    font-weight: 700;
    color: rgba(245, 224, 224, 0.75);
    letter-spacing: 0.12em;
    text-transform: lowercase;
}
</style>
</head>
<script src="/storage/js/c.js"></script>
<body>
<div class="wrap">
    <div class="logo">in<em>fuse</em></div>
    <div class="bar-wrap">
        <div id="loading-bar"></div>
        <img id="loading-dino" src="images/other/pinkdino.png" />
    </div>
    <div class="loading-text" id="loading-text">loading...</div>
</div>
<script>
const bar = document.getElementById("loading-bar");
const dino = document.getElementById("loading-dino");
const wrap = document.querySelector(".bar-wrap");
const text = document.getElementById("loading-text");

function setProgress(p) {
    p = Math.max(0, Math.min(100, p));
    bar.style.width = p + "%";
    const w = wrap.offsetWidth;
    dino.style.left = (p / 100 * w - 14) + "px";
    if (p < 50) text.textContent = "loading...";
    else if (p < 90) text.textContent = "almost done...";
    else if (p < 100) text.textContent = "hang tight...";
    else {
        text.textContent = "done!";
        setTimeout(() => {
            window.parent.postMessage("xylora-loading-done", "*");
        }, 250);
    }
}

window.addEventListener("message", (e) => {
    if (e.data?.type === "progress") {
        setProgress(e.data.value);
    }
});
</script>
</body>
</html>
