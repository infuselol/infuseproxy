<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>infuse</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Outfit", Arial, Helvetica, sans-serif;
    font-weight: 600;
    background: #0b0808;
    user-select: none;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("/images/themes/forest_v2.png") center/cover no-repeat;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.58);
    z-index: 0;
}

.wrap {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    gap: 4px;
    transform: translateY(-2vh);
}

.logo {
    font-size: 52px;
    font-weight: 800;
    color: #f5e0e0;
    letter-spacing: 3px;
    text-transform: lowercase;
    text-shadow: 0 0 32px rgba(180, 30, 30, 0.35);
}

.logo em {
    font-style: normal;
    color: #e05555;
}

.buttons {
    margin-top: 26px;
    width: 100%;
    max-width: 520px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 999px;
    text-decoration: none;
    color: #f5e0e0;
    background: rgba(180, 30, 30, 0.18);
    border: 1px solid rgba(224, 85, 85, 0.25);
    font-size: 14px;
    font-family: "Outfit", sans-serif;
    font-weight: 700;
    text-transform: lowercase;
    white-space: nowrap;
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    will-change: transform;
}

.btn:hover {
    background: rgba(180, 30, 30, 0.28);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(180, 30, 30, 0.25);
}

.btn-study {
    justify-self: end;
}

.btn-apps {
    justify-self: center;
}

.btn-settings {
    justify-self: start;
}

.socials {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: row;
    gap: 8px;
    z-index: 999;
}

.socials a {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(180, 30, 30, 0.2);
    color: #f5e0e0;
    text-decoration: none;
    font-size: 13px;
    font-family: "Outfit", sans-serif;
    font-weight: 700;
    transition: 0.15s ease;
}

.socials a:hover {
    background: rgba(180, 30, 30, 0.32);
    transform: translateY(-2px);
}

.socials i {
    font-size: 14px;
}

.online {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(180, 30, 30, 0.2);
    color: #f5e0e0;
    font-size: 13px;
    font-family: "Outfit", sans-serif;
    font-weight: 700;
    z-index: 999;
    transition: 0.15s ease;
}

.online:hover {
    background: rgba(180, 30, 30, 0.32);
    transform: translateY(-2px);
}

.online span {
    color: #e05555;
    font-size: 13px;
}
</style>
</head>
<body>
<script src="storage/js/c.js"></script>
<div class="online">
  online users: <span id="online-count">0</span>
</div>
<div class="wrap">
    <div class="logo">in<em>fuse</em></div>
    <div class="buttons">
        <a class="btn btn-study" href="study.html">
            <i class="fa-solid fa-magnifying-glass"></i>
            browse study
        </a>
        <a class="btn btn-apps" href="apps.html">
            <i class="fa-solid fa-th-large"></i>
            apps
        </a>
        <a class="btn btn-settings" href="settings.html">
            <i class="fa-solid fa-gear"></i>
            settings
        </a>
    </div>
</div>
<div class="socials">
    <a href="https://discord.gg/3CDcBgQ6p6" target="_blank">
        <i class="fa-brands fa-discord"></i>
        <span>discord</span>
    </a>
    <a href="https://tiktok.com/@xyloranetwork" target="_blank">
        <i class="fa-brands fa-tiktok"></i>
        <span>tiktok</span>
    </a>
</div>
<script>
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "online-users") return;
  const el = document.getElementById("online-count");
  if (el) el.textContent = event.data.count;
});
</script>
</body>
</html>
